# Multi-project verification fixture — project A (VERIFICATION_GUIDE.md §7,
# multi-project workspace walkthrough).
#
# Deliberately shares the basename `regression.yaml` with proj_b so the
# display-name disambiguation behavior is observable, and uses a distinct
# suite/test namespace (alu_*) so per-project state isolation (baseline,
# trends, dashboard filter/sort/selection) is visible against proj_b's
# fifo_* namespace. Both tests pass when iverilog is on PATH.
#
# Restore after the guide's delete-and-relaunch step with:
#   git checkout -- verification/fixtures/multi_project
version: '1'

defaults:
  simulator: icarus
  pass_fail:
    type: string_match
    pass_string: TEST PASSED
  waveform:
    capture: never

suites:
  alu:
    description: Project A smoke suite for the multi-project walkthrough.
    tests:
      - name: alu_add
        top: tb_alu_add
        sources:
          - tb_alu_add.v
      - name: alu_sub
        top: tb_alu_sub
        sources:
          - tb_alu_sub.v
