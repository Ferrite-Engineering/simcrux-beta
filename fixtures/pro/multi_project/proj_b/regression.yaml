# Multi-project verification fixture — project B (VERIFICATION_GUIDE.md §7,
# multi-project workspace walkthrough).
#
# Shares the basename `regression.yaml` with proj_a (display-name
# disambiguation) and uses the fifo_* namespace so per-project state
# isolation is observable. `fifo_overflow` deliberately fails (its
# testbench never prints the pass string), so project B always carries
# one red row against all-green project A — useful for the baseline /
# trend / dashboard-isolation steps.
#
# Restore after the guide's delete-and-relaunch step with:
#   git checkout -- verification/fixtures/multi_project
version: '1'

defaults:
  simulator: icarus
  pass_fail:
    type: string_match
    pass_string: TEST PASSED
  waveform:
    capture: never

suites:
  fifo:
    description: Project B smoke suite for the multi-project walkthrough.
    tests:
      - name: fifo_smoke
        top: tb_fifo_smoke
        sources:
          - tb_fifo_smoke.v
      - name: fifo_overflow
        top: tb_fifo_overflow
        sources:
          - tb_fifo_overflow.v
